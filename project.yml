name: Switchboard
options:
  bundleIdPrefix: dev.switchboard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Switchboard:
    type: application
    platform: macOS
    sources: [Sources/Switchboard]
    dependencies:
      - package: SwiftTerm
    info:
      path: Sources/Switchboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: dev.switchboard.Switchboard.oauth
            CFBundleURLSchemes: [switchboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.switchboard.Switchboard
        PRODUCT_NAME: Switchboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Switchboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
  SwitchboardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/SwitchboardTests]
    dependencies:
      - target: Switchboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Switchboard.app/Contents/MacOS/Switchboard"
schemes:
  Switchboard:
    build:
      targets:
        Switchboard: all
        SwitchboardTests: [test]
    test:
      targets: [SwitchboardTests]
